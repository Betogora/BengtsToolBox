# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check documentation
        run: npm run docs:check

  core-tests:
    name: Core tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test core logic
        run: npm test

  firebase-rules-tests:
    name: Firebase rules tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Test Firebase rules
        run: npm run test:firebase

  # Same selection as the live workflow, compared against the pull request base.
  select-browser-specs:
    name: Select browser specs
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      specs: ${{ steps.select.outputs.specs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Select affected specs
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE_SHA"
          if ! git fetch --depth=1 origin "$base"; then base=""; fi
          node scripts/selectBrowserSpecs.mjs --base "$base"

  browser-test-shards:
    name: Browser tests (${{ matrix.shard }}/3)
    needs: select-browser-specs
    if: ${{ needs.select-browser-specs.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium
      # SPECS is empty for the full suite, so it stays unquoted.
      - name: Test browser flows
        env:
          SPECS: ${{ needs.select-browser-specs.outputs.specs }}
        run: npx playwright test $SPECS --shard=${{ matrix.shard }}/3 --pass-with-no-tests
      - name: Upload browser failure artifacts
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # Keeps the required check name stable; skipped shards count as passed.
  browser-tests:
    name: Browser tests
    needs: [select-browser-specs, browser-test-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require passing shards
        env:
          SELECT_RESULT: ${{ needs.select-browser-specs.result }}
          SHARDS_RESULT: ${{ needs.browser-test-shards.result }}
        run: |
          test "$SELECT_RESULT" = success
          test "$SHARDS_RESULT" = success -o "$SHARDS_RESULT" = skipped

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Upload hosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosting-dist
          path: dist
          retention-days: 1

  preview:
    name: Preview deploy
    needs: [lint, core-tests, firebase-rules-tests, browser-tests, build]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download hosting artifact
        uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: dist
      - name: Authenticate for cost check
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BENGTSTOOLBOX }}
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Require Spark without billing
        run: GOOGLE_ACCESS_TOKEN="$(gcloud auth print-access-token)" node scripts/checkFirebaseSpark.mjs
        env:
          FIREBASE_PROJECT_ID: bengtstoolbox
      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BENGTSTOOLBOX }}
          projectId: bengtstoolbox
          firebaseToolsVersion: 15.22.1
