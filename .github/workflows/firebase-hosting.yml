name: Deploy Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Only the newest push matters; an older run still in progress is cancelled.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Deploys without waiting for the browser suite, which runs alongside in
  # three shards and marks the commit red if a flow broke.
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check documentation
        run: npm run docs:check

      - name: Test core logic
        run: npm test

      - name: Build app
        run: npm run build

      - name: Authenticate for cost check
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BENGTSTOOLBOX }}
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Require Spark without billing
        run: GOOGLE_ACCESS_TOKEN="$(gcloud auth print-access-token)" node scripts/checkFirebaseSpark.mjs
        env:
          FIREBASE_PROJECT_ID: bengtstoolbox
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BENGTSTOOLBOX }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          firebaseToolsVersion: 15.22.1

  # Compares against the last fully green run, so changes from cancelled or
  # failed runs are tested again. Without a usable base the full suite runs.
  select-browser-specs:
    name: Select browser specs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.select.outputs.run }}
      specs: ${{ steps.select.outputs.specs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select affected specs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          if [ "${{ github.event_name }}" = "push" ]; then
            base="$(gh run list --workflow firebase-hosting.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)"
            if [ -n "$base" ] && ! git fetch --depth=1 origin "$base"; then base=""; fi
          fi
          node scripts/selectBrowserSpecs.mjs --base "$base"

  browser-tests:
    name: Browser tests (${{ matrix.shard }}/3)
    needs: select-browser-specs
    if: ${{ needs.select-browser-specs.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # SPECS is empty for the full suite, so it stays unquoted.
      - name: Test browser flows
        env:
          SPECS: ${{ needs.select-browser-specs.outputs.specs }}
        run: npx playwright test $SPECS --shard=${{ matrix.shard }}/3 --pass-with-no-tests

      - name: Upload browser failure artifacts
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
