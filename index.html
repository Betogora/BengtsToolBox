<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BengtsToolBox – ein synchronisierter App-Hub für Spieleabende, Gruppen und kleine Turniere."
    />
    <meta name="theme-color" content="#063852" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="BengtsToolBox" />
    <meta
      property="og:description"
      content="Werkzeuge für Spielstände, Zufall, Teamspiele, Karten und Turniere."
    />
    <title>BengtsToolBox – App-Hub</title>
    <script>
      // Applies the stored or system color scheme before the first paint; ColorSchemeProvider adopts it.
      var colorScheme = null
      try {
        colorScheme = localStorage.getItem('bengtstoolbox.colorScheme')
      } catch (error) {}
      if (colorScheme === 'dark' || (colorScheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
